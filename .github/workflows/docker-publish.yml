name: Docker Image build and deploy
# After a push to this repository, a Docker image is built and
# pushed to a VPS server and run


on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  
jobs:
  build_and_publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Set the value
        id: step_one
        run: |
          echo "action_state=yellow" >> "$GITHUB_ENV"
          
      - name: Use the value
        id: step_two
        run: |
          printf 'action_state value is: %s' "$action_state"
          printf 'action_state value is: $action_state'
          echo 'action_state value is: $action_state'
          
          
      - name: GitHub repo username to lowercase
        run: |
          echo "REPO_NAME_LC=yellow" >> $env:GITHUB_ENV
          echo $REPO_NAME_LC
          echo ${{ env.REPO_NAME_LC }}
          echo "Repo name ${{ github.repository_owner }} stored as $REPO_NAME_LC in REPO_NAME_LC"
          echo "Repo name ${{ github.repository_owner }} stored as ${{ env.REPO_NAME_LC }} in REPO_NAME_LC"
