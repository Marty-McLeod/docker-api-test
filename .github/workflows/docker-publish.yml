name: Docker Image build and deploy
# After a push to this repository, a Docker image is built and
# pushed to a VPS server and run


on:
  push:
    branches: [ main,master]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  
jobs:
  build_and_publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      
    steps:      
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log into package/image registry (${{ env.REGISTRY }})
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker-specific env variables
      # NOTE! env variables defined in a step cannot be referenced until another step, hence the need for separate ones
      - name: Convert GitHub username to lowercase
        run: |
          echo "REPO_USERNAME_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build Docker image name (image 'tag')
        run: |
          echo "IMAGE_REPO_NAME_LC=$(echo '${{ env.REGISTRY }}/${{ env.REPO_USERNAME_LC }}/${{ github.event.repository.name }}')" 
            >> $GITHUB_ENV
          
      - name: Assign version (tag)
      # Assigns 'latest' as default
        run: |
          echo "TAG_NAME=latest" >> $GITHUB_ENV
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile
          context: .
          push: ${{ github.event_name  != 'pull_request' }}
          tags: ${{ env.IMAGE_REPO_NAME_LC }}:${{ env.TAG_NAME }}
        # tags: ${{ env.REGISTRY }}/${{ env.REPO_USERNAME_LC }}/${{ github.event.repository.name }}:${{ env.TAG_NAME }}

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
          # USERNAME:   $REPO_USERNAME_LC
          REPO_NAME:  ${{ github.event.repository.name }} 
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: GHCR_TOKEN, REPO_NAME, REPO_USERNAME_LC, TAG_NAME
          script: |
            echo $GHCR_TOKEN | docker login ghcr.io -u $REPO_USERNAME_LC --password-stdin
            docker image pull ghcr.io/$REPO_USERNAME_LC/$REPO_NAME:$TAG_NAME
            docker container stop api
            docker container rm api
            docker container run --name api -p 8000:8000 ghcr.io/$REPO_USERNAME_LC/$REPO_NAME

      
