name: Docker image build and deploy
# Build & deployment workflow to build a Docker image, log into the VPS server, and
# run a Docker container
on:
  push:
    branches: main
      
  pull_request:
    branches: main
    types: [closed, labeled]
      
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
          - info
          - warning
          - debug    
  
env:
  REGISTRY: ghcr.io
  SHOULD_DEPLOY: ${{  ( github.event_name == 'pull_request' && github.event.pull_request.merged == true && 
                       contains(github.event.pull_request.labels.*.name, 'deploy') 
                       ) ||
                      ( 
                        github.event_name == 'pull_request' && github.event.pull_request.merged == true && 
                        github.event.action == 'labeled' && 
                        contains(github.event.pull_request.labels.*.name, 'deploy') 
                       ) ||
                      (
                        github.event_name == 'workflow_dispatch'
                      )
                  }}                                
                  
jobs:
  # Preliminary job to exit the workflow process if a deploy situation is not present
  validate_deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate should_deploy status
        uses: actions/github-script@v7
        with:
          script: |
            // NOTE: adding a '#' type comment inside the clause causes a syntax error failure.
            // If deploy is not valid, fail the workflow and return a message
            const deploy_flag = process.env.SHOULD_DEPLOY;
            if (deploy_flag == 'false') {
              core.setFailed("INFO: Deployment conditions not met. Exiting workflow early.");
            } 
          
  # The job continues only if the 'should_deploy' value is true
  build_and_publish:
    runs-on: ubuntu-24.04
    needs: validate_deploy
    permissions:
      contents: read
      packages: write
    steps:      
      - name: Checkout repository (${{ github.ref_name }})
        uses: actions/checkout@v6

      - name: Log into package/image registry (${{ env.REGISTRY }})
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker-specific env variables
      # NOTE! env variables defined in a step cannot be referenced until another step, hence the 
      # need for separate steps after each is created
      - name: Convert GitHub username to lowercase
        run: |
          echo "REPO_USERNAME_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build Docker image name (image 'tag')
        id: image
        run: >
          echo "IMAGE_REPO_NAME_LC=$(echo '${{ env.REGISTRY }}/
        ${{ env.REPO_USERNAME_LC }}/${{ github.event.repository.name }}')" >> $GITHUB_ENV
          
      - name: Assign version (tag)
      # Assigns 'latest' as default
        run: |
          echo "TAG_NAME=latest" >> $GITHUB_ENV
          echo "REPO_USERNAME_LC: ${{ env.REPO_USERNAME_LC }}"
          echo "IMAGE_REPO_NAME_LC: ${{ env.IMAGE_REPO_NAME_LC }}"
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile
          context: .
          push: true
          tags: ${{ env.IMAGE_REPO_NAME_LC }}:${{ env.TAG_NAME }}

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo ${{ secrets.GHCR_TOKEN }} | docker login ${{ env.REGISTRY}} -u ${{ env.REPO_USERNAME_LC }} --password-stdin
              
            docker image pull ${{ env.IMAGE_REPO_NAME_LC }}:${{ env.TAG_NAME }}
            docker container stop api
            docker container rm api
            docker container run -d --name api -p 8000:8000 ${{ env.IMAGE_REPO_NAME_LC }}

