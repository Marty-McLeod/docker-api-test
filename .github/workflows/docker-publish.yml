name: Docker Image build and deploy
# After a push to this repository, a Docker image is built and
# pushed to a VPS server and run


on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  
jobs:
  build_and_publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: GitHub repo username to lowercase
        run: |
          echo "REPO_USERNAME_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          
      - name: Checkout repository
        uses: actions/checkout@v6

      # - name: Log into package/image registry (${{ env.REGISTRY }})
      #   if: github.event_name != 'pull_request'
      #   uses: docker/login-action@v4
      #   with:
      #     registry: ${{ env.REGISTRY }}
      #     username: ${{ github.repository_owner }}
      #     password: ${{ secrets.GITHUB_TOKEN }}
      
      # - name: Extract Docker metadata (image name data)
      #   id: meta
      #   uses: docker/metadata-action@v6
      #   with:
      #     images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # - name: Build and push Docker image
      #   uses: docker/build-push-action@v6
      #   with:
      #     context: .
      #     push: ${{ github.event_name  != 'pull_request' }}
      #     tags: ${{ steps.meta.outputs.tags }}
      #     labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
          # USERNAME:   $REPO_USERNAME_LC
          REPO_NAME:  ${{ github.event.repository.name }} 
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: GHCR_TOKEN, REPO_NAME, REPO_USERNAME_LC
          script: |
            echo $GHCR_TOKEN | docker login ghcr.io -u $REPO_USERNAME_LC --password-stdin
            docker image pull ghcr.io/$REPO_USERNAME_LC/$REPO_NAME:main
            docker container stop api
            docker container rm api
            docker container run --name container-api -p 8000:8000 $REPO_USERNAME_LC/$REPO_NAME

      
